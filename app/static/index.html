<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>app-hub</title>
  <!-- Served from gateway itself, so every path here is same-origin and
       relative. No CDN on purpose: the container runs read-only with no
       outbound internet guaranteed, and a start page that goes blank because
       a CDN is down is not a start page. -->
  <link rel="stylesheet" href="/static/style.css">
  <!-- SVG first: it carries its own prefers-color-scheme rules, so the
       mark follows the tab bar rather than fighting it. The PNGs are the
       fallback for Safari, which does not support SVG favicons at all, and
       icon-180 is what iOS and Android use for a home-screen shortcut. -->
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
</head>
<body>
  <header>
    <h1>
      <!-- THE HUB MARK. Inline rather than <img src="logo.svg"> on purpose:
           inline SVG inherits currentColor and var(--accent) from the tokens
           in style.css, so the mark follows the light/dark switch with no
           second copy of the palette to drift out of sync. An <img> is an
           opaque document and would need its own hardcoded colours.
           aria-hidden because the wordmark right next to it already reads
           "app-hub"; announcing it twice is worse than not at all. -->
      <svg class="logo" viewBox="0 0 32 32" width="20" height="20"
           aria-hidden="true" focusable="false">
        <g fill="currentColor" stroke="currentColor">
          <line x1="16" y1="16" x2="16" y2="4.6" stroke-width="1.9" stroke-linecap="round" opacity="0.5"/>
          <line x1="16" y1="16" x2="27.4" y2="16" stroke-width="1.9" stroke-linecap="round" opacity="0.5"/>
          <line x1="16" y1="16" x2="16" y2="27.4" stroke-width="1.9" stroke-linecap="round" opacity="0.5"/>
          <line x1="16" y1="16" x2="4.6" y2="16" stroke-width="1.9" stroke-linecap="round" opacity="0.5"/>
          <circle cx="16" cy="4.6" r="2.9"/>
          <circle cx="27.4" cy="16" r="2.9"/>
          <circle cx="16" cy="27.4" r="2.9"/>
          <circle cx="4.6" cy="16" r="2.9"/>
        </g>
        <!-- The core is the accent green -- deliberately the same token as the
             liveness dot on every row below. -->
        <circle cx="16" cy="16" r="5.2" fill="var(--accent, #2f6f4f)"/>
      </svg>
      app-hub
    </h1>
    <input id="search" type="search" placeholder="Search…  (press /)"
           autocomplete="off" spellcheck="false" aria-label="Filter links">
    <button id="toggle-add" type="button" aria-expanded="false">+ Add</button>
  </header>

  <!-- Hidden until the button is pressed. A start page is for starting; the
       form is the rare path, not the common one. -->
  <form id="add-form" hidden>
    <input name="name" placeholder="Name" required maxlength="80">
    <input name="url" placeholder="https://…" required type="url">
    <input name="category" placeholder="Category" required maxlength="40" list="categories">
    <datalist id="categories"></datalist>
    <input name="icon" placeholder="Icon (emoji, optional)" maxlength="8">
    <button type="submit">Save</button>
    <button type="button" id="cancel-add">Cancel</button>
  </form>

  <!-- role=alert so a screen reader announces a failure rather than leaving
       the page silently empty. -->
  <div id="banner" role="alert" hidden></div>

  <main id="links" aria-busy="true"></main>

  <footer>
    <span id="count"></span>
    <span id="summary"></span>
    <a href="/health">/health</a>
    <a href="/docs">API</a>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
